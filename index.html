<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apresentação Rótulo Salubre</title>
  <meta name="theme-color" content="#f3f1ec" />
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{
      overflow:hidden;
      font-family:Arial,Helvetica,sans-serif;
      color:#4f5651;
      background:
        radial-gradient(circle at 50% 46%,rgba(146,164,151,.20) 0%,rgba(146,164,151,.08) 26%,rgba(146,164,151,0) 54%),
        linear-gradient(180deg,#f8f6f1 0%,#ece9e2 100%);
    }
    .page{position:relative;width:100%;height:100dvh;min-height:560px}
    h1{
      position:absolute;z-index:5;top:clamp(26px,5vh,68px);left:50%;transform:translateX(-50%);
      width:min(92vw,980px);margin:0;text-align:center;
      font-size:clamp(30px,4.3vw,66px);line-height:.98;letter-spacing:-.045em;font-weight:300;
      color:#58605b;pointer-events:none;
    }
    h1 strong{font-weight:800;color:#6b7f70}
    .stage{position:absolute;inset:clamp(92px,14vh,150px) 0 0;display:grid;place-items:center}
    .halo{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(72vw,780px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(111,134,116,.12);pointer-events:none}
    .halo:after{content:"";position:absolute;inset:8%;border-radius:50%;border:2px solid rgba(111,134,116,.08);border-top-color:transparent;transform:rotate(-20deg)}
    model-viewer{
      width:min(96vw,1050px);height:100%;min-height:460px;background:transparent;z-index:2;outline:none;
      --poster-color:transparent;
    }
    .shadow{position:absolute;left:50%;bottom:clamp(26px,4.5vh,52px);transform:translateX(-50%);width:min(54vw,580px);height:50px;border-radius:50%;background:radial-gradient(ellipse,rgba(34,40,36,.20),rgba(34,40,36,.08) 45%,transparent 72%);filter:blur(13px);pointer-events:none}
    .hint{position:absolute;z-index:6;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:rgba(70,77,72,.68);background:rgba(255,255,255,.48);border:1px solid rgba(0,0,0,.04);backdrop-filter:blur(6px);padding:8px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
    .loading{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#f3f1ec;transition:.35s ease}
    .loading.hide{opacity:0;visibility:hidden}
    .spinner{width:42px;height:42px;border-radius:50%;border:3px solid rgba(107,127,112,.18);border-top-color:#6b7f70;animation:spin .8s linear infinite}
    .error{display:none;position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.92);font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:700px){h1{top:28px;font-size:clamp(30px,9.5vw,48px)}.stage{inset:112px 0 0}.shadow{width:78vw;bottom:20px}.hint{font-size:11px;bottom:10px}}
  </style>
</head>
<body>
  <main class="page">
    <h1>Apresentação <strong>Rótulo Salubre</strong></h1>
    <section class="stage" aria-label="Apresentação 3D do rótulo Salubre">
      <div class="halo" aria-hidden="true"></div>
      <model-viewer
        id="product"
        src="./para%20catalogo.glb"
        alt="Pote 3D Salubre"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="14deg"
        interaction-prompt="none"
        environment-image="neutral"
        exposure="0.78"
        tone-mapping="neutral"
        shadow-intensity="0.85"
        shadow-softness="0.92"
        camera-orbit="0deg 78deg 110%"
        min-camera-orbit="auto auto 70%"
        max-camera-orbit="auto auto 160%"
        field-of-view="28deg">
      </model-viewer>
      <div class="shadow" aria-hidden="true"></div>
    </section>
    <div class="hint">Arraste para girar • Scroll para aproximar</div>
    <div class="loading" id="loading"><div class="spinner"></div></div>
    <div class="error" id="error">Não foi possível carregar o modelo 3D.</div>
  </main>
  <script>
    const model=document.getElementById('product');
    const loading=document.getElementById('loading');
    const error=document.getElementById('error');
    model.addEventListener('load',()=>loading.classList.add('hide'));
    model.addEventListener('error',()=>{loading.classList.add('hide');error.style.display='block';});
    setTimeout(()=>loading.classList.add('hide'),12000);
  </script>
</body>
</html>
