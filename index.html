<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apresentação Rótulo Salubre</title>
  <meta name="theme-color" content="#f3f1ec" />
  <style>
    :root{
      --bg1:#f7f5f0;
      --bg2:#ece8e0;
      --ink:#4f5651;
      --accent:#6d7f70;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{
      overflow:hidden;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(62vw 62vw at 50% 42%, rgba(160,174,162,.16) 0%, rgba(160,174,162,.06) 18%, rgba(160,174,162,0) 45%),
        linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    }
    .page{position:relative;width:100%;height:100dvh;min-height:580px}
    .title{
      position:absolute;
      top:clamp(26px,4.6vh,68px);
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,980px);
      margin:0;
      text-align:center;
      z-index:5;
      letter-spacing:-.045em;
      line-height:.96;
      font-size:clamp(28px,4.2vw,66px);
      font-weight:300;
      color:#58605b;
      pointer-events:none;
      text-wrap:balance;
    }
    .title strong{font-weight:800;color:var(--accent)}
    .stage{
      position:absolute;
      inset:clamp(88px,13vh,150px) 0 0;
    }
    #app{position:absolute; inset:0;}
    .ground-shadow{
      position:absolute;
      left:50%;
      bottom:clamp(22px,4vh,52px);
      transform:translateX(-50%);
      width:min(54vw,620px);
      height:48px;
      border-radius:50%;
      background:radial-gradient(ellipse, rgba(35,42,38,.22) 0%, rgba(35,42,38,.11) 42%, rgba(35,42,38,0) 72%);
      filter:blur(14px);
      z-index:1;
      pointer-events:none;
    }
    .halo{
      position:absolute;
      left:50%;
      top:46%;
      transform:translate(-50%,-50%);
      width:min(78vw,860px);
      aspect-ratio:1/1;
      z-index:0;
      opacity:.55;
      pointer-events:none;
    }
    .halo::before, .halo::after{
      content:"";
      position:absolute;
      inset:10% 10%;
      border-radius:50%;
      border:2px solid rgba(135,150,138,.18);
      border-top-color:transparent;
      border-right-color:rgba(135,150,138,.1);
      transform:rotate(-18deg);
    }
    .halo::after{
      inset:15% 15%;
      border-width:3px;
      border-left-color:rgba(135,150,138,.09);
      border-bottom-color:rgba(135,150,138,.14);
      border-top-color:transparent;
      border-right-color:transparent;
      transform:rotate(14deg);
    }
    .loading{
      position:absolute;inset:0;display:grid;place-items:center;z-index:10;
      background:rgba(244,242,236,.92);transition:opacity .35s ease, visibility .35s ease;
    }
    .loading.hide{opacity:0;visibility:hidden}
    .spinner{
      width:44px;height:44px;border-radius:50%;border:3px solid rgba(109,127,112,.18);border-top-color:var(--accent);
      animation:spin .8s linear infinite;
    }
    .hint{
      position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
      z-index:5;font-size:12px;letter-spacing:.02em;color:rgba(79,86,81,.75);pointer-events:none;
      background:rgba(255,255,255,.38);backdrop-filter:blur(6px);padding:8px 12px;border-radius:999px;
      border:1px solid rgba(0,0,0,.04);
    }
    @keyframes spin {to{transform:rotate(360deg)}}
    @media (max-width: 720px){
      .title{top:28px;font-size:clamp(28px,9vw,48px)}
      .stage{inset:112px 0 0}
      .ground-shadow{width:76vw;height:42px;bottom:18px}
      .hint{bottom:12px;font-size:11px;padding:7px 10px}
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">Apresentação <strong>Rótulo Salubre</strong></h1>

    <section class="stage" aria-label="Site de apresentação 3D do rótulo Salubre">
      <div class="halo" aria-hidden="true"></div>
      <div id="app"></div>
      <div class="ground-shadow" aria-hidden="true"></div>
    </section>

    <div class="hint">Arraste para girar • Scroll para aproximar</div>
    <div class="loading" id="loading"><div class="spinner"></div></div>
  </main>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';

    const app = document.getElementById('app');
    const loading = document.getElementById('loading');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(app.clientWidth, app.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92; // segura os brancos para não estourar
    renderer.physicallyCorrectLights = true;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(28, app.clientWidth / app.clientHeight, 0.1, 100);
    camera.position.set(0, 1.0, 5.0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.4;
    controls.enablePan = false;
    controls.minDistance = 2.6;
    controls.maxDistance = 7.2;
    controls.minPolarAngle = THREE.MathUtils.degToRad(68);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(98);
    controls.target.set(0, 0.95, 0);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envTexture = pmremGenerator.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.environment = envTexture;

    // Luzes principais para reflexo controlado e leitura limpa do rótulo
    const hemi = new THREE.HemisphereLight(0xffffff, 0xe9e3d6, 1.05);
    hemi.position.set(0, 5, 0);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(2.8, 4.6, 4.4);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xf6f1e8, 1.2);
    fill.position.set(-3.2, 2.4, 3.0);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 1.0);
    rim.position.set(-1.8, 3.4, -4.0);
    scene.add(rim);

    const accent = new THREE.PointLight(0xf4efe6, 35, 12, 2);
    accent.position.set(0, 1.8, 2.8);
    scene.add(accent);

    const loader = new GLTFLoader();
    let modelRoot;

    loader.load('./salubre_mg7.glb', (gltf) => {
      modelRoot = gltf.scene;
      scene.add(modelRoot);

      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      modelRoot.position.x -= center.x;
      modelRoot.position.y -= box.min.y;
      modelRoot.position.z -= center.z;

      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.45 / maxDim;
      modelRoot.scale.setScalar(scale);
      modelRoot.position.y += 0.02;

      modelRoot.traverse((obj) => {
        if (!obj.isMesh) return;
        obj.castShadow = false;
        obj.receiveShadow = false;
        const mat = obj.material;
        if (!mat) return;

        // Preserva reflexos sutis sem estourar materiais claros
        if ('envMapIntensity' in mat) mat.envMapIntensity = 0.75;
        if ('roughness' in mat && mat.roughness < 0.18) mat.roughness = 0.18;
        if ('metalness' in mat && mat.metalness > 0.65) mat.metalness = 0.65;

        // Ajuste suave para materiais muito claros/estourados
        if (mat.color) {
          const hsl = { h: 0, s: 0, l: 0 };
          mat.color.getHSL(hsl);
          if (hsl.l > 0.88) {
            hsl.l = 0.84;
            mat.color.setHSL(hsl.h, hsl.s, hsl.l);
          }
        }
        mat.needsUpdate = true;
      });

      // enquadramento automático
      const finalBox = new THREE.Box3().setFromObject(modelRoot);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      const finalCenter = finalBox.getCenter(new THREE.Vector3());
      const fitHeightDistance = finalSize.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)));
      const fitWidthDistance = fitHeightDistance / camera.aspect;
      const distance = 1.28 * Math.max(fitHeightDistance, fitWidthDistance);

      camera.position.set(finalCenter.x + 0.10, finalCenter.y + finalSize.y * 0.44, distance + finalCenter.z);
      controls.target.set(finalCenter.x, finalCenter.y + finalSize.y * 0.42, finalCenter.z);
      controls.update();
      loading.classList.add('hide');
    }, undefined, (err) => {
      console.error(err);
      loading.classList.add('hide');
      alert('Não foi possível carregar o modelo 3D.');
    });

    function resize() {
      const w = app.clientWidth;
      const h = app.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
