name: MK Launcher APK
on:
  push:
    branches: [mk-launcher-v1]
    paths: ['mk-launcher/**', '.github/workflows/mk-launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: mk-launcher
      - run: cp mk-launcher/app/build/outputs/apk/debug/app-debug.apk MK-Launcher-V1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MK-Launcher-V1
          path: MK-Launcher-V1.apk
          retention-days: 14
