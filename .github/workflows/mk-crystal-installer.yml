name: MK Crystal Installer APK
on:
  push:
    branches: [mk-crystal-installer]
    paths: ['mk-crystal-installer/**', '.github/workflows/mk-crystal-installer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: mk-crystal-installer
      - run: |
          cp mk-crystal-installer/app/build/outputs/apk/debug/app-debug.apk MK-Crystal-Installer.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose MK-Crystal-Installer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MK-Crystal-Installer
          path: MK-Crystal-Installer.apk
          retention-days: 14
